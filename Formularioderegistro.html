<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informacion</title>
    <link rel="stylesheet" href="Formularioderegistro.css">
</head>
<body class="pagina">
<form>
    <table>
    <tr>
        <th colspan="2">
            <p><h1>FORMULARIO DE INGRESO DE INFORMACION</h1></p>
        </th>
    </tr>
    <tr>
        <td class="etiquetas">Nombre</td>
        <td><input type="text" name="Nombre" placeholder="Escriba Su Nombre Aqui"></td>
    </tr>

    <tr>
        <td class="etiquetas">Apellidos</td>
        <td><input type="text" name="Apellido" placeholder="Escriba sus Apellidos Aqui"></td>
    </tr>

    <tr>
        <td class="etiquetas">Direccion</td>
        <td><input type="text" name="Direccion" placeholder="Escriba Su Direccion Aqui"></td>
    </tr>

    <tr>
        <td class="etiquetas">Telefono</td>
        <td><input type="text" name="Telefono" placeholder="Escriba Su Numero Telefonico Aqui"></td>
    </tr>
    
    <tr>
        <td class="etiquetas">Correo Electronico</td>
        <td><input type="text" name="Correo" placeholder="Escriba Su Correo Aqui"></td>
    </tr>
    
    <tr>
        <td class="etiquetas">Edad</td>
        <td><input type="text" name="Edad" placeholder="Escriba Su Edad"></td>
    </tr>
    
     <tr>
        <td class="etiquetas">Genero</td>
        <td>Masculino <input type="radio" name="genero" value="Masculino"> <br>
            Femenino <input type="radio" name="genero" value="Femenino"></td>
    </tr>
   
    <tr>
        <td class="etiquetas">Institucion</td>
        <td><input type="text" name="Institucion" placeholder="Escriba Su Institucion"></td>
    </tr>

    <tr>
        <td class="etiquetas">Grado</td>
        <td><input type="text" name="Grado" placeholder="Escriba Su Grado"></td>
    </tr>

    <tr>
        <td class="etiquetas">Seccion</td>
        <td><input type="text" name="Seccion" placeholder="Escriba Su Seccion"></td>
    </tr>
    
    <tr>
    <td>
         <input type="submit" name="Enviar" id="" value="Enviar"></td><td><input type="reset" name="Cancelar" id="" value="Cancelar">
    </td>
    </tr>
    </table>
</form>
</body>
</html>

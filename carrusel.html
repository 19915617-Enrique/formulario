<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrusel</title>
    <link rel="stylesheet" href="carrusel.css">
</head>
<body>
    <div class="carrusel-container">
        <input type="radio" name="carrusel-control" id="slide-1" checked>
        <input type="radio" name="carrusel-control" id="slide-2">
        <input type="radio" name="carrusel-control" id="slide-3">
        <input type="radio" name="carrusel-control" id="slide-4">
        <input type="radio" name="carrusel-control" id="slide-5">

        <div class="carrusel-slide">
            <div class="slide">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRz-wxpOnLrjg6CD2wMJgQFH0sKmyBD7hDDSoiROgRz1w&s=10" alt="Luffy">
            </div>
            <div class="slide">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQUbsni9rKshGQoeDmdvDhm6Pm1P6gdHb7lWjmYaHP9Sw&s=10" alt="Tanjiro">
            </div>
            <div class="slide">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS-_o_p9EbhRCYPF1EAxXElTFzQt1cPEBOpeNz0zLDGCw&s=10" alt="Tanjiro cayendo">
            </div>
            <div class="slide">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ03g9LsZ9iIhqucqe6giinn-jjlezlo40p5VwDUfNxhg&s=10" alt="Imagen 4">
            </div>
            <div class="slide">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTp4ZL0OAO_me2nxJGi_K8-RJgthcR8P1wuRlGUSqeO1g&s=10" alt="Imagen 5">
            </div>
        </div>

        <div class="carrusel-navegacion">
            <label for="slide-1" class="nav-dot" ></label>
            <label for="slide-2" class="nav-dot" ></label>
            <label for="slide-3" class="nav-dot" ></label>
            <label for="slide-4" class="nav-dot" ></label>
            <label for="slide-5" class="nav-dot" ></label>
        </div>
    </div>
   </body>
</html>
